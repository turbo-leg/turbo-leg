<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Turbileg Uurtsaikh — multiplayer games and full-stack apps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132238"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <g id="card">
      <rect x="-48" y="-68" width="96" height="136" rx="9" fill="#fbfaf7" stroke="#d9d4c7"/>
    </g>
    <style>
      .name { font: 600 56px Georgia, 'Times New Roman', serif; fill: #f8fafc; letter-spacing: -0.5px; }
      .tag  { font: 400 22px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .chip { font: 600 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #cbd5e1; letter-spacing: 0.6px; }
      .pip  { font: 700 26px Georgia, serif; }
      .pip[font-size="20"] { font-size: 20px; }
      .red  { fill: #d94848; } .blk { fill: #1f2937; }
      .c { transform-box: view-box; transform-origin: 930px 330px; animation: fan 1.6s cubic-bezier(.2,.8,.2,1) both; }
      .c1 { --r: -30deg; } .c2 { --r: -15deg; animation-delay: .08s; } .c3 { --r: 0deg; animation-delay: .16s; }
      .c4 { --r: 15deg; animation-delay: .24s; } .c5 { --r: 30deg; animation-delay: .32s; }
      @keyframes fan { from { transform: rotate(0deg); opacity: 0; } 30% { opacity: 1; } to { transform: rotate(var(--r)); opacity: 1; } }
      .float { animation: float 6s ease-in-out 1.8s infinite; transform-box: view-box; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      .fade { animation: fade 1.2s ease-out both; } .fade2 { animation-delay: .25s; } .fade3 { animation-delay: .5s; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

  <g class="fade">
    <text x="64" y="128" class="name">Turbileg Uurtsaikh</text>
  </g>
  <g class="fade fade2">
    <text x="66" y="170" class="tag">Real-time multiplayer games &amp; production full-stack apps</text>
  </g>
  <g class="fade fade3">
    <rect x="64" y="200" width="196" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="84" y="222" class="chip">CS @ UBC OKANAGAN</text>
    <rect x="272" y="200" width="172" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="292" y="222" class="chip">FROM MONGOLIA</text>
  </g>

  <g class="float" filter="url(#shadow)">
    <g class="c c1"><g transform="translate(930 190)"><use href="#card"/><text x="-36" y="-36" class="pip blk">A</text><text x="-36" y="-12" class="pip blk" font-size="20">♠</text><text x="-12" y="16" class="pip blk" font-size="44">♠</text></g></g>
    <g class="c c2"><g transform="translate(930 190)"><use href="#card"/><text x="-36" y="-36" class="pip red">K</text><text x="-36" y="-12" class="pip red" font-size="20">♥</text><text x="-14" y="16" class="pip red" font-size="44">♥</text></g></g>
    <g class="c c3"><g transform="translate(930 190)"><use href="#card"/><text x="-36" y="-36" class="pip blk">Q</text><text x="-36" y="-12" class="pip blk" font-size="20">♣</text><text x="-14" y="16" class="pip blk" font-size="44">♣</text></g></g>
    <g class="c c4"><g transform="translate(930 190)"><use href="#card"/><text x="-36" y="-36" class="pip red">J</text><text x="-36" y="-12" class="pip red" font-size="20">♦</text><text x="-12" y="16" class="pip red" font-size="44">♦</text></g></g>
    <g class="c c5"><g transform="translate(930 190)"><use href="#card"/><text x="-40" y="-36" class="pip blk">10</text><text x="-36" y="-12" class="pip blk" font-size="20">♠</text><text x="-12" y="16" class="pip blk" font-size="44">♠</text></g></g>
  </g>
</svg>
